services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    command: sleep infinity
    working_dir: /workspaces/doqsa
    environment:
      SUPABASE_STORAGE_ENDPOINT: http://supabase-storage:5000/s3
      SUPABASE_STORAGE_PUBLIC_ENDPOINT: http://localhost:${SUPABASE_STORAGE_PORT:-5000}/s3
      SUPABASE_STORAGE_BUCKET: doqsa-images
      SUPABASE_STORAGE_ACCESS_KEY: ${SUPABASE_STORAGE_ACCESS_KEY:-doqsa-local-access}
      SUPABASE_STORAGE_SECRET_KEY: ${SUPABASE_STORAGE_SECRET_KEY:-doqsa-local-secret-development-only}
      SUPABASE_STORAGE_REGION: local
    volumes:
      - ..:/workspaces/doqsa:cached
      - gradle-cache:/home/vscode/.gradle

  storage-db:
    image: postgres:17.6-alpine
    profiles: [supabase]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: doqsa-local-db-development-only
      POSTGRES_DB: storage
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d storage]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - supabase-storage-db:/var/lib/postgresql/data

  supabase-storage:
    image: supabase/storage-api:v1.89.12
    profiles: [supabase]
    depends_on:
      storage-db:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SUPABASE_STORAGE_PORT:-5000}:5000
    environment:
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 5000
      SERVER_REGION: local
      AUTH_JWT_SECRET: ${SUPABASE_STORAGE_JWT_SECRET:-doqsa-local-storage-jwt-secret-development-only}
      DATABASE_URL: postgres://postgres:doqsa-local-db-development-only@storage-db:5432/storage
      DB_INSTALL_ROLES: "true"
      TENANT_ID: doqsa-storage
      STORAGE_BACKEND: file
      STORAGE_FILE_BACKEND_PATH: /var/lib/storage
      STORAGE_S3_BUCKET: storage
      STORAGE_S3_REGION: local
      UPLOAD_FILE_SIZE_LIMIT: 10485760
      UPLOAD_FILE_SIZE_LIMIT_STANDARD: 10485760
      IMAGE_TRANSFORMATION_ENABLED: "false"
      S3_PROTOCOL_ENABLED: "true"
      S3_PROTOCOL_ACCESS_KEY_ID: ${SUPABASE_STORAGE_ACCESS_KEY:-doqsa-local-access}
      S3_PROTOCOL_ACCESS_KEY_SECRET: ${SUPABASE_STORAGE_SECRET_KEY:-doqsa-local-secret-development-only}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:5000/status').then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      default:
        aliases: [supabase-storage-public]
    volumes:
      - supabase-storage-files:/var/lib/storage

  storage-init:
    image: supabase/storage-api:v1.89.12
    profiles: [supabase]
    depends_on:
      supabase-storage:
        condition: service_healthy
    entrypoint: [node, /scripts/init-supabase-storage.mjs]
    environment:
      STORAGE_API_URL: http://supabase-storage:5000
      STORAGE_BUCKET: doqsa-images
      AUTH_JWT_SECRET: ${SUPABASE_STORAGE_JWT_SECRET:-doqsa-local-storage-jwt-secret-development-only}
    volumes:
      - ./init-supabase-storage.mjs:/scripts/init-supabase-storage.mjs:ro

volumes:
  gradle-cache:
  supabase-storage-db:
  supabase-storage-files:
