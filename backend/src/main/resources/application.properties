spring.application.name=com.doqsa.backend
spring.profiles.default=local
spring.jpa.open-in-view=false
doqsa.ocr.provider=${OCR_PROVIDER:none}
spring.ai.model.chat=${doqsa.ocr.provider}
spring.ai.google.genai.api-key=${GOOGLE_GEMINI_API_KEY:}
spring.ai.google.genai.chat.options.model=${GOOGLE_GEMINI_MODEL:gemini-2.5-flash}
doqsa.storage.provider=${STORAGE_PROVIDER:local}
doqsa.storage.region=${AWS_REGION:ap-northeast-2}
doqsa.storage.bucket=${AWS_S3_BUCKET:}
doqsa.storage.local-directory=${LOCAL_IMAGE_DIRECTORY:./data/images}
doqsa.queue.enabled=${OCR_QUEUE_ENABLED:true}
doqsa.queue.polling-enabled=${OCR_QUEUE_POLLING_ENABLED:true}
doqsa.queue.concurrency=${OCR_QUEUE_CONCURRENCY:2}
doqsa.queue.poll-delay-ms=${OCR_QUEUE_POLL_DELAY_MS:1000}
doqsa.queue.lease-duration=60s
doqsa.queue.heartbeat-interval=10s
doqsa.queue.task-timeout=2m
doqsa.queue.external-call-timeout=30s
doqsa.queue.shutdown-timeout=40s
logging.pattern.level=%5p [requestId=%X{requestId}]

# Supabase S3 protocol: use S3 access/secret keys, not the REST service_role key.
doqsa.storage.supabase.endpoint=${SUPABASE_STORAGE_ENDPOINT:}
doqsa.storage.supabase.public-endpoint=${SUPABASE_STORAGE_PUBLIC_ENDPOINT:}
doqsa.storage.supabase.bucket=${SUPABASE_STORAGE_BUCKET:}
doqsa.storage.supabase.access-key=${SUPABASE_STORAGE_ACCESS_KEY:}
doqsa.storage.supabase.secret-key=${SUPABASE_STORAGE_SECRET_KEY:}
doqsa.storage.supabase.region=${SUPABASE_STORAGE_REGION:local}
doqsa.storage.supabase.url-validity=10m
doqsa.storage.supabase.call-timeout=30s

# OCR uses chat only; do not auto-create unrelated OpenAI models.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none

# OpenAI-compatible OCR adapters are configured independently.
doqsa.ocr.openai.api-key=${OPENAI_API_KEY:}
doqsa.ocr.openai.model=${OPENAI_OCR_MODEL:gpt-4o-mini}
doqsa.ocr.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
doqsa.ocr.openai.timeout=${doqsa.queue.external-call-timeout:30s}
doqsa.ocr.grok.api-key=${XAI_API_KEY:}
doqsa.ocr.grok.model=${GROK_OCR_MODEL:grok-2-vision-1212}
doqsa.ocr.grok.base-url=${XAI_BASE_URL:https://api.x.ai/v1}
doqsa.ocr.grok.timeout=${doqsa.queue.external-call-timeout:30s}
