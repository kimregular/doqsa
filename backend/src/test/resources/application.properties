spring.datasource.url=jdbc:h2:mem:doqsa-test;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.ai.model.chat=none
doqsa.ocr.provider=none
doqsa.storage.provider=local
doqsa.storage.local-directory=./build/test-images/default
doqsa.queue.enabled=false
doqsa.queue.polling-enabled=false

# OCR uses chat only; do not auto-create unrelated OpenAI models.
spring.ai.model.embedding=none
spring.ai.model.image=none
spring.ai.model.moderation=none
spring.ai.model.audio.speech=none
spring.ai.model.audio.transcription=none
